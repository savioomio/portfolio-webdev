name: CI - Build e deploy

# Valida padrao de commits, lint, formatacao e build em todo push e PR.
# Num push na main (merge de PR), publica no Worker portfolio-webdev (ADR 0005).

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build de validacao
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4
        with:
          # Historico completo para o commitlint comparar a branch do PR com a main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Os hooks do Husky podem ser pulados com --no-verify; aqui nao
      - name: Padrao dos commits do PR
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint
        run: npm run lint

      - name: Formatacao
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Conferir que o dist foi gerado
        run: test -f dist/index.html && echo "Build OK"

      - name: Conferir que _headers foi copiado
        run: test -f dist/_headers && echo "Headers OK"

  deploy:
    name: Deploy na Cloudflare
    # So depois do build passar, e so na main: PR nunca publica
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Um deploy por vez; um merge novo espera o anterior terminar
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: https://webdev.savioomiodev.com.br

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala o wrangler na versao do package-lock, a mesma do deploy manual
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Build e publicacao
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
