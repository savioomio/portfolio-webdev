name: CI - Build

# Valida que o projeto compila. O deploy no Cloudflare Workers e feito com `npm run deploy`.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build de validacao
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Conferir que o dist foi gerado
        run: test -f dist/index.html && echo "Build OK"

      - name: Conferir que _headers foi copiado
        run: test -f dist/_headers && echo "Headers OK"
